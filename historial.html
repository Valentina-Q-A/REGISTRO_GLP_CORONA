<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Histórico GLP</title>

<style>
body{
font-family:Arial;
padding:40px;
background:#f4f4f4;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:#222;
color:white;
}

button{
padding:10px 20px;
margin:10px;
cursor:pointer;
}
</style>

</head>

<body>

<h1>Histórico Planta GLP</h1>

<input type="date" id="fecha">

<button onclick="buscar()">Buscar</button>
<button onclick="cargarHistorico()">Reset</button>
<button onclick="exportar()">Exportar Excel</button>

<table>

<thead id="encabezados">
</thead>

<tbody id="tabla">
</tbody>

</table>


<!-- ============================================
     CONFIGURACIÓN CENTRAL DE VARIABLES
     ============================================ -->

<script src="js/variables.js"></script>


<script>

// ============================================
// DATOS GLOBALES
// ============================================

let DATA_GLOBAL = [];


// ============================================
// VARIABLES DEL HISTÓRICO
// ============================================
//
// Una variable aparecerá en el histórico si
// tiene definido "excelField" en variables.js.
//
// Esto significa que agregar una nueva variable
// al catálogo puede hacer que aparezca
// automáticamente en esta tabla.
//

function getHistoricalVariables() {

    return Object.entries(VARIABLES)
        .filter(([, variable]) => variable.excelField);

}


// ============================================
// GENERAR ENCABEZADOS
// ============================================

function generarEncabezados() {

    const encabezados =
        document.getElementById("encabezados");

    if (!encabezados) {
        return;
    }

    const variables =
        getHistoricalVariables();

    encabezados.innerHTML = `

        <tr>

            <th>Fecha</th>

            <th>Hora</th>

            ${variables.map(([, variable]) => `
                <th>
                    ${variable.excelField}
                </th>
            `).join("")}

            <th>FechaServidor</th>

        </tr>
    `;
}


// ============================================
// CARGAR HISTÓRICO
// ============================================

async function cargarHistorico() {

    try {

        const response =
            await fetch("/historial");

        if (!response.ok) {
            throw new Error(
                "No se pudo cargar el histórico"
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                "El servidor no devolvió un arreglo"
            );
        }

        DATA_GLOBAL = data;

        renderTabla(DATA_GLOBAL);

    } catch (error) {

        console.error(
            "Error cargando histórico:",
            error
        );

        DATA_GLOBAL = [];

        renderTabla([]);

    }

}


// ============================================
// RENDER TABLA
// ============================================

function renderTabla(data) {

    const tabla =
        document.getElementById("tabla");

    if (!tabla) {
        return;
    }

    const variables =
        getHistoricalVariables();

    tabla.innerHTML = "";

    data.forEach(record => {

        const fila = document.createElement("tr");


        // ========================================
        // FECHA
        // ========================================

        const fecha =
            document.createElement("td");

        fecha.textContent =
            record.Fecha ?? "";

        fila.appendChild(fecha);


        // ========================================
        // HORA
        // ========================================

        const hora =
            document.createElement("td");

        hora.textContent =
            record.Hora ?? "";

        fila.appendChild(hora);


        // ========================================
        // VARIABLES
        // ========================================

        variables.forEach(([, variable]) => {

            const celda =
                document.createElement("td");

            const field =
                variable.excelField;

            celda.textContent =
                record[field] ?? "N/A";
            fila.appendChild(celda);

        });


        // ========================================
        // FECHA SERVIDOR
        // ========================================

        const fechaServidor =
            document.createElement("td");

        fechaServidor.textContent =
            record.FechaServidor ?? "";

        fila.appendChild(fechaServidor);


        tabla.appendChild(fila);

    });

}


// ============================================
// BUSCAR
// ============================================

async function buscar() {

    const fecha =
        document.getElementById("fecha").value;

    if (!fecha) {

        await cargarHistorico();

        return;
    }

    try {

        const response =
            await fetch(
                `/historial?fecha=${encodeURIComponent(fecha)}`
            );

        if (!response.ok) {
            throw new Error(
                "No se pudo realizar la búsqueda"
            );
        }

        const data =
            await response.json();

        DATA_GLOBAL = Array.isArray(data)
            ? data
            : [];

        renderTabla(DATA_GLOBAL);

    } catch (error) {

        console.error(
            "Error buscando histórico:",
            error
        );

        DATA_GLOBAL = [];

        renderTabla([]);

    }

}


// ============================================
// EXPORTAR
// ============================================

function exportar() {

    const variables =
        getHistoricalVariables();

    const filas = [];


    // ========================================
    // ENCABEZADOS
    // ========================================

    filas.push([

        "Fecha",
        "Hora",

        ...variables.map(
            ([, variable]) =>
                variable.excelField
        ),

        "FechaServidor"

    ]);


    // ========================================
    // DATOS
    // ========================================

    DATA_GLOBAL.forEach(record => {

        filas.push([

            record.Fecha ?? "",
            record.Hora ?? "",

            ...variables.map(
                ([, variable]) =>
                    record[variable.excelField] ?? ""
            ),

            record.FechaServidor ?? ""

        ]);

    });


    // ========================================
    // CREAR ARCHIVO
    // ========================================

    const contenido =
        filas
            .map(fila =>
                fila.join("\t")
            )
            .join("\n");


    const blob = new Blob(
        [contenido],
        {
            type:
                "application/vnd.ms-excel"
        }
    );


    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "historico_glp.xls";

    link.click();

    URL.revokeObjectURL(link.href);

}


// ============================================
// INICIALIZACIÓN
// ============================================

window.addEventListener(
    "DOMContentLoaded",
    () => {

        generarEncabezados();

        cargarHistorico();

    }
);

</script>

</body>
</html>
