<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Histórico GLP</title>

<style>
body{
font-family:Arial;
padding:40px;
background:#f4f4f4;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:#222;
color:white;
}

button{
padding:10px 20px;
margin:10px;
cursor:pointer;
}

.form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    margin-bottom: 5px;
    font-weight: bold;
    text-align: left;
}

.form-group input {
    width: 100%;
}

.historial-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 15px 0 25px 0;
    flex-wrap: wrap;
}

.pagination-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.pagination-container button {
    min-width: 110px;
}

#pageInfo {
    font-weight: bold;
    padding: 0 10px;
}

#resultsInfo {
    text-align: center;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 10px;
}

</style>

</head>

<body>

<h1>Histórico Planta GLP</h1>

<div class="registro-form">

    <h2>Filtros</h2>

    <div class="form-row">

        <div class="form-group">
            <label for="fechaDesde">
                Fecha desde
            </label>

            <input
                type="date"
                id="fechaDesde">
        </div>

        <div class="form-group">
            <label for="fechaHasta">
                Fecha hasta
            </label>

            <input
                type="date"
                id="fechaHasta">
        </div>

        <div class="form-group">
            <label for="filtroEncargado">
                Encargado
            </label>

            <input
                type="text"
                id="filtroEncargado">
        </div>

        <div class="form-group">
            <label for="filtroObservacion">
                Observación
            </label>

            <input
                type="text"
                id="filtroObservacion">
        </div>

        <div class="form-group">
            <label for="filtroPlaca">
                Placa
            </label>

            <input
                type="text"
                id="filtroPlaca">
        </div>

    </div>

</div>

<div class="historial-actions">

    <button id="btnBuscar">
        Buscar
    </button>

    <button id="btnReset">
        Limpiar
    </button>

    <button id="btnExportar">
        Exportar Excel
    </button>

</div>

<div id="resultsInfo"></div>

<div class="pagination-container">

    <button id="firstPage">
        ⏮ Primera
    </button>

    <button id="prevPage">
        ◀ Anterior
    </button>

    <span id="pageInfo">
        Página 1 de 21
    </span>

    <button id="nextPage">
        Siguiente ▶
    </button>

    <button id="lastPage">
        Última ⏭
    </button>

</div>

<table>

<thead id="encabezados">
</thead>

<tbody id="tabla">
</tbody>

</table>


<!-- ============================================
     CONFIGURACIÓN CENTRAL DE VARIABLES
     ============================================ -->

<script src="js/variables.js"></script>


<script>

// ============================================
// DATOS GLOBALES
// ============================================

let DATA_GLOBAL = [];

let PAGINA_ACTUAL = 1;

const PAGE_SIZE = 50;

// ============================================
// VARIABLES DEL HISTÓRICO
// ============================================
//
// Una variable aparecerá en el histórico si
// tiene definido "excelField" en variables.js.
//
// Esto significa que agregar una nueva variable
// al catálogo puede hacer que aparezca
// automáticamente en esta tabla.
//

function getHistoricalVariables() {

    return Object.entries(VARIABLES)
        .filter(([, variable]) => {

            if (!variable.excelField) {
                return false;
            }

            return ![
                "Fecha",
                "Hora"
            ].includes(
                variable.excelField
            );
        });

}

// ============================================
// GENERAR ENCABEZADOS
// ============================================

function generarEncabezados() {

    const encabezados =
        document.getElementById("encabezados");

    if (!encabezados) {
        return;
    }

    const variables =
        getHistoricalVariables();

    encabezados.innerHTML = `

        <tr>

            <th>Fecha</th>

            <th>Hora</th>

            ${variables.map(([, variable]) => `
                <th>
                    ${variable.excelField}
                </th>
            `).join("")}

            <th>Registrado en Servidor</th>

        </tr>
    `;
}


// ============================================
// CARGAR HISTÓRICO
// ============================================

async function cargarHistorico() {

    try {

        const response =
            await fetch(
                `/historial?t=${Date.now()}`,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "No se pudo cargar el histórico"
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                "El servidor no devolvió un arreglo"
            );
        }

        DATA_GLOBAL = data;

        PAGINA_ACTUAL = 1;

        renderPagina();

    } catch (error) {

        console.error(
            "Error cargando histórico:",
            error
        );

        DATA_GLOBAL = [];

        renderTabla([]);

    }

}

// ============================================
// NORMALIZADORES
// ============================================

function normalizarPlaca(valor) {

    return String(valor || "")
        .trim()
        .toUpperCase()
        .replace(/[-\s]/g, "");

}

// ============================================
// RENDER TABLA
// ============================================

function renderTabla(data) {

    const tabla =
        document.getElementById("tabla");

    if (!tabla) {
        return;
    }

    const variables =
        getHistoricalVariables();

    tabla.innerHTML = "";

    data.forEach(record => {

        const fila = document.createElement("tr");


        // ========================================
        // FECHA
        // ========================================

        const fecha =
            document.createElement("td");

        fecha.textContent =
            record.Fecha ?? "";

        fila.appendChild(fecha);


        // ========================================
        // HORA
        // ========================================

        const hora =
            document.createElement("td");

        hora.textContent =
            record.Hora ?? "";

        fila.appendChild(hora);


        // ========================================
        // VARIABLES
        // ========================================

        variables.forEach(([, variable]) => {

            const celda =
                document.createElement("td");

            const field =
                variable.excelField;

            celda.textContent =
                record[field] ?? "N/A";
            fila.appendChild(celda);

        });


        // ========================================
        // FECHA SERVIDOR
        // ========================================

        const fechaServidor =
            document.createElement("td");

        fechaServidor.textContent =
            record.FechaServidor ?? "";

        fila.appendChild(fechaServidor);


        tabla.appendChild(fila);

    });

}

// ============================================
// RENDER PAGINADOR
// ============================================

function renderPagina() {

    const inicio =
        (PAGINA_ACTUAL - 1) * PAGE_SIZE;

    const fin =
        inicio + PAGE_SIZE;

    const pagina =
        DATA_GLOBAL.slice(
            inicio,
            fin
        );

    renderTabla(pagina);

    actualizarPaginador();
}

function actualizarPaginador() {

    const totalPaginas =
        Math.max(
            1,
            Math.ceil(
                DATA_GLOBAL.length /
                PAGE_SIZE
            )
        );
    const resultsInfo =
        document.getElementById(
            "resultsInfo"
        );

    if (resultsInfo) {
        resultsInfo.textContent =
            `${DATA_GLOBAL.length} registros encontrados`;
    }


    const paginaInfo =
        document.getElementById(
            "pageInfo"
        );

    if (paginaInfo) {

        paginaInfo.textContent =
            `Página ${PAGINA_ACTUAL} de ${totalPaginas}`;
    }

    const btnAnterior =
        document.getElementById(
            "prevPage"
        );

    const btnSiguiente =
        document.getElementById(
            "nextPage"
        );

    if (btnAnterior) {
        btnAnterior.disabled =
            PAGINA_ACTUAL === 1;
    }

    if (btnSiguiente) {
        btnSiguiente.disabled =
            PAGINA_ACTUAL === totalPaginas;
    }
}

// ============================================
// BUSCAR
// ============================================

async function buscar() {

    const fechaDesde =
        document.getElementById(
            "fechaDesde"
        ).value;

    const fechaHasta =
        document.getElementById(
            "fechaHasta"
        ).value;

    const encargado =
        document.getElementById(
            "filtroEncargado"
        ).value
            .trim()
            .toLowerCase();

    const observacion =
        document.getElementById(
            "filtroObservacion"
        ).value
            .trim()
            .toLowerCase();

    const placa =
        document.getElementById(
            "filtroPlaca"
        ).value;

    try {

        const response =
            await fetch(
                `/historial?t=${Date.now()}`,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "No se pudo cargar el histórico"
            );
        }

        const data =
            await response.json();

        DATA_GLOBAL =
            Array.isArray(data)
                ? data
                : [];

        // ========================================
        // RANGO DE FECHAS
        // ========================================

        if (fechaDesde) {

            DATA_GLOBAL =
                DATA_GLOBAL.filter(
                    registro =>
                        registro.Fecha >=
                        fechaDesde
                );
        }

        if (fechaHasta) {

            DATA_GLOBAL =
                DATA_GLOBAL.filter(
                    registro =>
                        registro.Fecha <=
                        fechaHasta
                );
        }

        // ========================================
        // ENCARGADO
        // ========================================

        if (encargado) {

            DATA_GLOBAL =
                DATA_GLOBAL.filter(
                    registro =>
                        String(
                            registro.Encargado || ""
                        )
                            .toLowerCase()
                            .includes(encargado)
                );
        }

        // ========================================
        // OBSERVACIONES
        // ========================================

        if (observacion) {

            DATA_GLOBAL =
                DATA_GLOBAL.filter(
                    registro =>
                        String(
                            registro.Observaciones || ""
                        )
                            .toLowerCase()
                            .includes(observacion)
                );
        }

        // ========================================
        // PLACA
        // ========================================

        if (placa) {

            const placaBuscada =
                normalizarPlaca(placa);

            DATA_GLOBAL =
                DATA_GLOBAL.filter(
                    registro =>
                        normalizarPlaca(
                            registro.PlacaCisterna
                        ).includes(
                            placaBuscada
                        )
                );
        }

        PAGINA_ACTUAL = 1;

        renderPagina();

    } catch (error) {

        console.error(
            "Error buscando histórico:",
            error
        );

        DATA_GLOBAL = [];

        renderTabla([]);
    }
}

// ============================================
// EXPORTAR
// ============================================

function exportar() {

    const variables =
        getHistoricalVariables();

    const filas = [];


    // ========================================
    // ENCABEZADOS
    // ========================================

    filas.push([

        "Fecha",
        "Hora",

        ...variables.map(
            ([, variable]) =>
                variable.excelField
        ),

        "FechaServidor"

    ]);


    // ========================================
    // DATOS
    // ========================================

    DATA_GLOBAL.forEach(record => {

        filas.push([

            record.Fecha ?? "",
            record.Hora ?? "",

            ...variables.map(
                ([, variable]) =>
                    record[variable.excelField] ?? ""
            ),

            record.FechaServidor ?? ""

        ]);

    });


    // ========================================
    // CREAR ARCHIVO
    // ========================================

    const contenido =
        filas
            .map(fila =>
                fila.join("\t")
            )
            .join("\n");


    const blob = new Blob(
        [contenido],
        {
            type:
                "application/vnd.ms-excel"
        }
    );


    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "historico_glp.xls";

    link.click();

    URL.revokeObjectURL(link.href);

}


// ============================================
// INICIALIZACIÓN
// ============================================

window.addEventListener(
    "DOMContentLoaded",
    () => {

        generarEncabezados();

        cargarHistorico();

        document
            .getElementById("btnBuscar")
            .addEventListener(
                "click",
                buscar
            );

        document
            .getElementById("btnReset")
            .addEventListener(
                "click",
                () => {

                    document.getElementById(
                        "fechaDesde"
                    ).value = "";

                    document.getElementById(
                        "fechaHasta"
                    ).value = "";

                    document.getElementById(
                        "filtroEncargado"
                    ).value = "";

                    document.getElementById(
                        "filtroObservacion"
                    ).value = "";

                    document.getElementById(
                        "filtroPlaca"
                    ).value = "";

                    cargarHistorico();

                }
            );

        document
            .getElementById("btnExportar")
            .addEventListener(
                "click",
                exportar
            );

        document
            .getElementById("prevPage")
            .addEventListener(
                "click",
                () => {

                    if (
                        PAGINA_ACTUAL > 1
                    ) {

                        PAGINA_ACTUAL--;

                        renderPagina();
                    }
                }
            );

        document
            .getElementById("nextPage")
            .addEventListener(
                "click",
                () => {

                    const totalPaginas =
                        Math.ceil(
                            DATA_GLOBAL.length /
                            PAGE_SIZE
                        );

                    if (
                        PAGINA_ACTUAL <
                        totalPaginas
                    ) {

                        PAGINA_ACTUAL++;

                        renderPagina();
                    }
                }
            );

        document
            .getElementById("firstPage")
            .addEventListener(
                "click",
                () => {

                    PAGINA_ACTUAL = 1;

                    renderPagina();

                }
            );

        document
            .getElementById("lastPage")
            .addEventListener(
                "click",
                () => {

                    PAGINA_ACTUAL =
                        Math.max(
                            1,
                            Math.ceil(
                                DATA_GLOBAL.length /
                                PAGE_SIZE
                            )
                        );

                    renderPagina();

                }
            );
    }
);

</script>

</body>
</html>
